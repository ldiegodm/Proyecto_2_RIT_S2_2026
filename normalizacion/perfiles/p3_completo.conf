# Perfil P3 - completo
# Todas las politicas: fechas, fechas geologicas, numeros, expresiones de varias palabras
# (binomiales, eventos), tesauro del dominio y lematizacion por diccionario (WordNet).

[perfil]
nombre = p3_completo
descripcion = Fechas, tiempo geologico, multipalabras, tesauro y lematizacion por diccionario

[normalizacion]
nfkc = si
unir_guiones = si
plegar_diacriticos = si
plegado = ../recursos/plegado.txt
fechas = si
numeros = normalizar
fechas_geologicas = si
multipalabras = ../recursos/multipalabras.txt
stopwords = ../recursos/stopwords_snowball.txt
tesauro = ../recursos/tesauro.txt
protegidos = .*[_0-9].*|.*(saurus|raptor|ceratops|odon|pteryx|mimus|titan|suchus|venator|lophus|cephale|pelta|gnathus|nychus|rhynchus)
raices = lemas
lemas = ../recursos/lemas_en.txt
longitud_minima = 2
longitud_maxima = 40
