# Perfil P1 - base
# Normalizacion minima: unicode, minusculas, tokenizacion y lista corta de palabras vacias.
# Sirve como linea base para medir lo que aportan los demas perfiles.
#
# Formato: archivo de configuracion estilo INI de Linux (secciones [x], clave = valor,
# comentarios con # o ;). Las rutas son relativas a la carpeta de este archivo.
# Booleanos: si / no.

[perfil]
nombre = p1_base
descripcion = Minusculas, unicode y lista corta de palabras vacias; sin raices

[normalizacion]
nfkc = si
unir_guiones = si
plegar_diacriticos = si
plegado = ../recursos/plegado.txt
fechas = no
numeros = conservar
fechas_geologicas = no
multipalabras =
stopwords = ../recursos/stopwords_lucene.txt
tesauro =
protegidos =
raices = ninguna
lemas =
longitud_minima = 2
longitud_maxima = 40
