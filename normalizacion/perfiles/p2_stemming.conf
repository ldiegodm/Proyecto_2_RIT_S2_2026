# Perfil P2 - stemming
# P1 + numeros normalizados + lista de palabras vacias de Snowball + stemmer Snowball (Porter2).
# Los nombres de genero (Triceratops, Iguanodon...) se protegen para que el stemmer no los corte.

[perfil]
nombre = p2_stemming
descripcion = P1 + numeros, palabras vacias Snowball y stemming Porter2 con generos protegidos

[normalizacion]
nfkc = si
unir_guiones = si
plegar_diacriticos = si
plegado = ../recursos/plegado.txt
fechas = no
numeros = normalizar
fechas_geologicas = no
multipalabras =
stopwords = ../recursos/stopwords_snowball.txt
tesauro =
protegidos = .*[_0-9].*|.*(saurus|raptor|ceratops|odon|pteryx|mimus|titan|suchus|venator|lophus|cephale|pelta|gnathus|nychus|rhynchus)
raices = snowball
lemas =
longitud_minima = 2
longitud_maxima = 40
